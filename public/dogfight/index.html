<head>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Paper Dogfight 紙上空戰",
  "url": "https://games.csiesheep.com/bored_games/dogfight/",
  "image": "https://games.csiesheep.com/bored_games/art/og-dogfight.png",
  "description": "Pull back, let go, draw a line across the paper: cross an enemy plane and shoot it down. 按住飛機往後拉再放手,畫出的線穿過對方飛機就打下來。",
  "inLanguage": ["en", "zh-Hant"],
  "playMode": ["SinglePlayer", "MultiPlayer"],
  "gamePlatform": "Web browser",
  "applicationCategory": "Game",
  "author": { "@type": "Person", "name": "csiesheep" }
}
</script>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body class="df-body" data-page="dogfight">
<div class="df-page">

  <header class="df-bar">
    <a href="../" data-i18n="nav.contents"></a>
    <b data-i18n="game.title"></b>
    <a href="rules.html" data-i18n="nav.rules"></a>
  </header>

  <!-- 開局頁:沒有 query 參數時顯示 -->
  <section id="setup" class="df-setup" hidden>
    <p class="bg-lbl" data-i18n="setup.vsComputer"></p>
    <a class="bg-btn df-opp" href="?play=easy">
      <span data-i18n="setup.bot.easy.name"></span><small data-i18n="setup.bot.easy.desc"></small></a>
    <a class="bg-btn df-opp" href="?play=normal">
      <span data-i18n="setup.bot.normal.name"></span><small data-i18n="setup.bot.normal.desc"></small></a>
    <a class="bg-btn df-opp" href="?play=hard">
      <span data-i18n="setup.bot.hard.name"></span><small data-i18n="setup.bot.hard.desc"></small></a>

    <p class="bg-lbl" data-i18n="setup.pair.label"></p>
    <a class="bg-btn df-go" href="?pair" data-i18n="setup.pair.button"></a>
    <p class="bg-sub" data-i18n="setup.pair.hint"></p>

    <p class="bg-lbl" data-i18n="setup.online.label"></p>
    <div class="df-row df-online">
      <button id="roomOpen" class="bg-btn df-go" type="button" data-i18n="setup.online.open"></button>
      <input id="roomCode" class="df-codein" type="text" maxlength="4" size="4" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             data-i18n-attr="placeholder:setup.online.code,aria-label:setup.online.code">
      <button id="roomJoin" class="bg-btn" type="button" data-i18n="setup.online.join"></button>
    </div>
    <p id="setupErr" class="bg-sub df-err" hidden></p>
  </section>

  <!-- 等人:?room=ABCD,畫完飛機、連上之後,對方還沒進來的那一頁 -->
  <section id="room" class="df-room" hidden>
    <p class="bg-lbl df-mid" data-i18n="room.label"></p>
    <div id="roomLetters" class="df-code"></div>
    <p class="bg-sub df-mid" data-i18n="room.tell"></p>
    <button id="roomCopy" class="bg-btn" type="button" data-i18n="room.copy"></button>
    <p id="roomWait" class="df-mid df-wait"></p>
    <button id="roomSitin" class="bg-btn" type="button"></button>
    <p id="roomNet" class="df-mid df-err" hidden></p>
    <a id="roomBack" class="bg-btn" href="./" hidden data-i18n="nav.back"></a>
  </section>

  <!-- 畫飛機:選完對手或對坐之後、開打之前。對坐時黑筆那一頁整頁轉 180°(.flip) -->
  <section id="draw" class="df-draw" hidden>
    <p id="drawWho" class="bg-lbl df-who" hidden></p>
    <h1 class="df-drawh" data-i18n="draw.title"></h1>
    <p class="bg-sub df-who" data-i18n="draw.sub"></p>
    <div class="df-boxes">
      <div class="df-box"><canvas class="df-pad"></canvas><span class="df-hint" data-i18n="draw.here"></span></div>
      <div class="df-box"><canvas class="df-pad"></canvas><span class="df-hint" data-i18n="draw.here"></span></div>
      <div class="df-box"><canvas class="df-pad"></canvas><span class="df-hint" data-i18n="draw.here"></span></div>
    </div>
    <div class="df-row">
      <button id="drawDefaults" class="bg-btn" type="button" data-i18n="draw.defaults"></button>
      <button id="drawRedo" class="bg-btn" type="button" data-i18n="draw.redo"></button>
    </div>
    <button id="drawDone" class="bg-btn df-go" type="button" data-i18n="draw.done"></button>
  </section>

  <!-- 紙 -->
  <section id="stage" class="df-stage" hidden>
    <div id="sheet" class="df-sheet">
      <canvas id="cv"></canvas>
      <div id="over" class="df-over" hidden>
        <p id="overTitle" class="df-win"></p>
        <p id="overGrade" class="df-grade" hidden></p>
        <p id="overSummary"></p>
        <div class="df-row">
          <button id="again" class="bg-btn df-go" type="button" data-i18n="over.again"></button>
          <a class="bg-btn" href="../" data-i18n="over.contents"></a>
        </div>
      </div>
    </div>
    <p id="turn" class="df-turn"></p>
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
