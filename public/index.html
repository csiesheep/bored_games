<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title data-i18n="cover.title">Bored Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cover">
  <div class="label">
    <h1 data-i18n="cover.title"></h1>
    <p class="fields" data-i18n="cover.fields"></p>
  </div>
  <h2 data-i18n="cover.contents"></h2>
  <ul class="toc">
    <li><span data-i18n="cover.game1"></span><a class="bg-btn df-go" href="dogfight/" data-i18n="cover.open"></a></li>
    <li class="off"><span data-i18n="cover.game2"></span><span data-i18n="cover.notyet"></span></li>
  </ul>
  <p class="foot">
    <span data-i18n="cover.foot"></span>
    <span><span data-i18n="lang.name"></span> / <button id="lang" class="bg-lang" type="button"></button></span>
  </p>
</main>
<script type="module">
import * as I from "./shared/i18n.js";
await I.init();
I.apply(document);
I.bindSwitch(document.getElementById("lang"));
</script>
</body>
</html>
